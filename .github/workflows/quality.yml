name: Laravel Quality
on:
  push:
    branches: [feature/laravel-do-bod, main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, bcmath, intl, zip, xml
          coverage: none
      - name: Composer install
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Migrate
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root
      - name: Test
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Frontend install
        run: npm install
      - name: Frontend build
        run: npm run build
